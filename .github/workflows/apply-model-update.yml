name: Apply final R2024b model update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Apply verified binary patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --binary .github/model-layout-update.patch
          git apply --binary .github/model-layout-update.patch
          rm .github/model-layout-update.patch
          echo "580e5a5a10fd5bf3788ad1598480b99abf9739f4d72b83a485aba804762194df  release/DAB_RA8P1_Final_Physical_MOSFET.slx" | sha256sum -c -
          grep -q "580E5A5A10FD5BF3788AD1598480B99ABF9739F4D72B83A485ABA804762194DF" README.md

      - name: Commit final release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Sync saved R2024b model layout"
          git push origin HEAD:main
